<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recettes voisines</title>
  <meta name="description" content="Comparer des recettes proches (crêpes, gaufres, pâtes…) : réseau de similarité, garde-manger interactif et comparaison côte à côte.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥞</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="back" href="../">← Mini-apps</a>
    <div class="title-row">
      <h1>🥞 Recettes voisines</h1>
      <div id="lang" class="chips" role="group" aria-label="Langue des noms d'ingrédients et de recettes">
        <button class="chip" data-lang="fr" aria-pressed="true">FR</button>
        <button class="chip" data-lang="bi" aria-pressed="false">FR · EN</button>
        <button class="chip" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <p class="lead">Quelles recettes se ressemblent, et quels ingrédients en débloquent une autre ?</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="placard" aria-selected="true">🧺 Garde-manger</button>
    <button role="tab" data-tab="reseau" aria-selected="false">🕸️ Réseau</button>
    <button role="tab" data-tab="radar" aria-selected="false">🎯 Radar</button>
    <button role="tab" data-tab="matrice" aria-selected="false">🔢 Matrice</button>
    <button role="tab" data-tab="comparer" aria-selected="false">⚖️ Comparer</button>
  </nav>

  <main>
    <section id="tab-placard" class="panel"></section>
    <section id="tab-reseau" class="panel" hidden></section>
    <section id="tab-radar" class="panel" hidden></section>
    <section id="tab-matrice" class="panel" hidden></section>
    <section id="tab-comparer" class="panel" hidden></section>
  </main>

  <footer><p>Données : tableau de recettes (<code>resources/</code>), régénéré avec <code>node recettes/build-data.mjs</code>. Quantités indicatives, par fournée.</p></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
